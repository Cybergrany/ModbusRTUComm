[platformio]
default_envs = native_trace_on

[native_tests]
platform = native
test_framework = unity
test_build_src = false
test_filter = test_transport
build_unflags =
  -std=c++11
  -std=c++14
  -std=c++17
  -std=gnu++14
  -std=gnu++17
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
  -I ${PROJECT_DIR}/src
  -I ${PROJECT_DIR}/test/support
  -DARDUINO=1
  -DMBUS_RTU_ALLOW_DIRECT_SERIAL_DIAGNOSTICS=0

[env:native_trace_on]
extends = native_tests
build_flags =
  ${native_tests.build_flags}
  -DMBUS_RTU_PLATFORM_TRACE=1

[env:native_trace_off]
extends = native_tests
build_flags =
  ${native_tests.build_flags}
  -DMBUS_RTU_PLATFORM_TRACE=0

[env:native_cxx11]
extends = native_tests
build_flags =
  ${native_tests.build_flags}
  -std=gnu++11
  -pedantic-errors
  -DMBUS_RTU_PLATFORM_TRACE=0
