[platformio]
default_envs = native_trace_on

[native_tests]
platform = native
test_framework = unity
test_build_src = false
test_filter = test_transport
build_unflags =
  -std=c++11
  -std=c++14
  -std=c++17
  -std=gnu++14
  -std=gnu++17
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
  -I ${PROJECT_DIR}/src
  -I ${PROJECT_DIR}/test/support
  -DARDUINO=1
  -DMBUS_RTU_ALLOW_DIRECT_SERIAL_DIAGNOSTICS=0

[env:native_trace_on]
extends = native_tests
build_flags =
  ${native_tests.build_flags}
  -DMBUS_RTU_PLATFORM_TRACE=1

[env:native_trace_off]
extends = native_tests
build_flags =
  ${native_tests.build_flags}
  -DMBUS_RTU_PLATFORM_TRACE=0

[env:native_cxx11]
extends = native_tests
build_flags =
  ${native_tests.build_flags}
  -std=gnu++11
  -pedantic-errors
  -DMBUS_RTU_PLATFORM_TRACE=0

[env:native_failure_backend]
platform = native
test_framework = unity
test_build_src = false
test_filter = test_failure_backend
build_unflags =
  -std=c++11
  -std=c++14
  -std=c++17
  -std=gnu++14
  -std=gnu++17
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
  -I ${PROJECT_DIR}/src
  -I ${PROJECT_DIR}/test/support
  -DARDUINO=1
  -DMBUS_DETAILED_METRICS=1
  -DMBUS_RTU_ALLOW_DIRECT_SERIAL_DIAGNOSTICS=0
  -DMBUS_RTU_PLATFORM_TRACE=0
  -DMBUS_RTU_PLATFORM_HEADER=\"FailurePlatform.h\"
  -DMBUS_RTU_PLATFORM_TYPE=failure_platform_test::Platform

[env:native_giga_registry]
platform = native
test_framework = unity
test_build_src = false
test_filter = test_giga_registry
build_unflags =
  -std=c++11
  -std=c++14
  -std=c++17
  -std=gnu++14
  -std=gnu++17
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
  -I ${PROJECT_DIR}/test/giga_support
  -I ${PROJECT_DIR}/src
  -DARDUINO=1
  -DARDUINO_GIGA=1

[env:production_profile]
platform = native
test_framework = unity
test_build_src = true
test_filter = test_production_profile
lib_compat_mode = off
lib_ldf_mode = deep+
build_unflags =
  -std=c++11
  -std=c++14
  -std=c++17
  -std=gnu++14
  -std=gnu++17
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
  -I ${PROJECT_DIR}/src
  -I ${PROJECT_DIR}/test/production_support
  -DARDUINO=1
  -DMBUS_DETAILED_METRICS=0
  -DMBUS_RTU_ALLOW_DIRECT_SERIAL_DIAGNOSTICS=0
  -DMBUS_RTU_PLATFORM_TRACE=0
  -DMBUS_RTU_ENABLE_RX_THREAD=0
  -DMBUS_RTU_RX_RING_SIZE=256
lib_deps =
  https://github.com/CMB27/ModbusADU.git#7cb0e24f0abe86bc83e114325d75fe7a7d878562
